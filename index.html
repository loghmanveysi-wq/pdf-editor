<!doctype html>
<html lang="fa" dir="rtl">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>ویرایشگر PDF</title>
<style>
@font-face{font-family:V;src:url(./fonts/Vazirmatn.ttf)}
:root{--bg:#e9ecef;--fg:#1b1f24;--bar:#fff;--ac:#0f766e;--bd:#cfd4da}

body{margin:0;background:var(--bg);color:var(--fg);font-family:V,Tahoma,sans-serif}

:root{--top:#0f766e;--onac:#fff}

#hd{position:sticky;top:0;z-index:60}
#top{display:flex;gap:6px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--top);color:#fff;overflow-x:auto}
#top b{font-size:17px;flex:1;white-space:nowrap}
#top button,#top label.b{flex:none;border:1px solid #fff6;border-radius:10px;background:#fff2;color:#fff;font:13px V,Tahoma,sans-serif;padding:7px 10px;white-space:nowrap}
#props{display:flex;gap:8px;align-items:center;padding:6px 10px;overflow-x:auto;background:var(--bar);border-bottom:1px solid var(--bd);font-size:13px}
#props select,#props input[type=number]{font:inherit;padding:5px;border-radius:8px;border:1px solid var(--bd);background:var(--bar);color:var(--fg)}
#props input[type=number]{width:54px}
#props input[type=color]{width:34px;height:30px;padding:0;border:0;background:none}
#props label{white-space:nowrap}
#props button{font:inherit;padding:4px 10px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:var(--fg)}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:space-around;background:var(--bar);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#dock button{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:var(--fg);font:11px V,Tahoma,sans-serif;padding:4px 8px;border-radius:12px}
#dock button span{font-size:20px;line-height:1.2}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;max-height:72vh;overflow:auto;background:var(--bar);border-top:1px solid var(--bd);border-radius:16px 16px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px #0005}

.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}.row b{flex:1}
#frl label{display:flex;gap:8px;align-items:center;padding:6px 0}#frl input,#frl select{flex:1;font:inherit;padding:6px}
#sc{border:1px dashed var(--bd);width:100%;background:#fff;touch-action:none}
#dock .on{background:var(--ac);color:var(--onac)}
.pg{position:relative;margin:12px auto;background:#fff;box-shadow:0 1px 8px #0004;direction:ltr}
.pg canvas,.pg svg,.lay{position:absolute;left:0;top:0}
svg,.lay{width:100%;height:100%;pointer-events:none}
svg *{pointer-events:stroke;cursor:pointer}
.t{position:absolute;pointer-events:auto;white-space:pre;line-height:1.2;outline:none;color:#000;font-family:V,Tahoma,sans-serif;padding:0;margin:0}
.t{outline:1px dotted #0f766e66}

.add{cursor:move;min-width:20px}

.im{position:absolute;pointer-events:auto;resize:both;overflow:hidden;cursor:move}

#empty{text-align:center;padding:60px 20px;opacity:.7}

#top{background:linear-gradient(135deg,#0f766e,#115e59);box-shadow:0 2px 10px #0003}

#dock button{flex:none;min-width:58px}
#dock .on{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}
.sheet{border-radius:22px 22px 0 0}

.grid button{border-radius:14px;background:var(--bg)}
#bd{position:fixed;inset:0;z-index:70;background:#0006}#bd[hidden]{display:none}

#pages{transform-origin:0 0;display:flex;flex-direction:column;align-items:center;touch-action:pan-x pan-y}
.pg{margin:12px 0}
#empty{margin:12vh 16px;padding:28px 18px;border-radius:22px;background:var(--bar);box-shadow:0 4px 20px #0002;line-height:1.9}
#empty button{margin-top:14px;padding:12px 22px;font:inherit;border:0;border-radius:999px;background:#0f766e;color:#fff;font-size:16px}

#hd{position:fixed;top:calc(6px + env(safe-area-inset-top));left:8px;right:8px;z-index:60;pointer-events:none}
#hd>*{pointer-events:auto}
#top{border-radius:18px;padding:6px 8px;box-shadow:0 4px 18px #0005}
#top b{font-size:14px}
#props{display:none;margin-top:6px;border-radius:16px;box-shadow:0 4px 16px #0004;border:1px solid var(--bd)}
body.ctx #props{display:flex}
#pages{padding:64px 0 120px}
#zw,#pages{direction:ltr}
body:not(.zoomed){overflow-x:hidden}
.pg{margin:8px 0}
html,body{touch-action:pan-x pan-y}
#hd,#dock,#zm{transform:translateZ(0);will-change:transform}

#pal{display:flex;gap:6px;flex:none}

#col{width:44px!important;height:34px!important}
#pal{display:inline-flex;gap:5px;align-items:center}#pal button{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);padding:0}body.hl #pal{display:none}
html,body{direction:ltr}
#hd,#dock,.sheet,#zm,#empty{direction:rtl}
#zw{position:relative;overflow:hidden}
#pages{position:absolute;left:0;top:0}
@media(max-width:560px){#top b{display:none}#top{justify-content:space-between;gap:4px}#top button,#top label.b{padding:7px 9px;font-size:12px}}

<div id="zw"><div id="pages"><div id="empty">یک فایل PDF باز کنید. همهٔ کارها روی همین دستگاه انجام می‌شود و چیزی به سرور فرستاده نمی‌شود.<br><button onclick="$('file').click()">📂 باز کردن PDF</button></div></div></div>
<div id="bd" hidden></div>

<div id="sig" class="sheet" hidden><canvas id="sc" width="300" height="150"></canvas><div class="row"><button id="sOk">ثبت امضا</button><button id="sClr">پاک</button><button id="sX">بستن</button></div></div>
<div id="frm" class="sheet" hidden><div id="frl"></div><button onclick="$('frm').hidden=true">تأیید</button></div>
<div id="pgm" class="sheet" hidden><div id="pgl"></div><div class="row"><label class="b">افزودن PDF<input id="pgAdd" type="file" accept="application/pdf" hidden></label><button id="pgX">بستن</button></div></div>

<script>
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg', S=1.5;
const FONTS=Object.fromEntries(['Vazirmatn','Sahel','Shabnam','Samim','Parastoo','Gandom','Tanha','Amiri','Lalezar','Tajawal','Lateef','ScheherazadeNew','NotoNaskh'].map(k=>[k,'./fonts/'+k+'.ttf']));
{const st=document.createElement('style');st.textContent=Object.entries(FONTS).map(([k,u])=>`@font-face{font-family:'${k}';src:url(${u})}`).join('');document.head.append(st);
 $('font').add(new Option('فونت اصلی سند','orig'));Object.keys(FONTS).forEach(k=>$('font').add(new Option(k,k)))}
pdfjsLib.GlobalWorkerOptions.workerSrc='./lib/pdf.worker.min.js';
let bytes,fname='edited.pdf',pages=[],tool='select',sel=null,fills={},marks=[];
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const rtl=s=>/[\u0590-\u08FF]/.test(s);

function setTool(t){tool=t;ctxUp();$('more').hidden=true;{const B=document.body.classList;B.toggle('draw',!['select','move','text','note'].includes(t));B.toggle('hl',t==='highlight');B.toggle('mv',t==='move');B.toggle('tt',t==='text');B.toggle('er',t==='erase');document.querySelectorAll('.t').forEach(d=>d.contentEditable=t!=='move')}
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
let Z=1,multi=false;
function select(e){if(sel)sel.classList.remove('sel');sel=e;if(e)e.classList.add('sel');place();ctxUp();
  if(e&&e.classList.contains('t')){$('col').value=e.dataset.c||'#000000';
    const f=e.dataset.f;$('font').value=[...$('font').options].some(o=>o.value===f)?f:'Vazirmatn';
    $('sz').value=Math.round(parseFloat(e.style.fontSize)/S*10)/10}}

$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  fname=f.name.replace(/\.pdf$/i,'')+'-edited.pdf';bytes=new Uint8Array(await f.arrayBuffer());await load();fit()};

async function load(){
  const doc=await pdfjsLib.getDocument({data:bytes.slice(),fontExtraProperties:true}).promise;
  $('pages').innerHTML='';pages=[];hist.length=0;redoS.length=0;
  for(let n=1;n<=doc.numPages;n++){
    const p=await doc.getPage(n),vp=p.getViewport({scale:S});
    const w=el('div','pg');w.style.width=vp.width+'px';w.style.height=vp.height+'px';
    const cv=el('canvas');cv.width=vp.width;cv.height=vp.height;
    const ctx=cv.getContext('2d',{willReadFrequently:true});
    await p.render({canvasContext:ctx,viewport:vp}).promise;
    const svg=document.createElementNS(NS,'svg'),L=el('div','lay');
    w.append(cv,svg,L);$('pages').append(w);applyZ();
    const pg={n,w,svg,L,ctx,p,cw:vp.width,ch:vp.height};pages.push(pg);
    const tc=await p.getTextContent();
    for(const it of tc.items){
      if(!it.str.trim())continue;
      const t=pdfjsLib.Util.transform(vp.transform,it.transform),fs=Math.hypot(t[2],t[3]),x=t[4],y=t[5];
      let nm='';try{const fo=p.commonObjs.get(it.fontName);nm=fo.name||'';if(fo.data&&!FD[it.fontName])FD[it.fontName]=fo.data}catch(_){}
      mkItem(pg,{x,y,fs,w:it.width*S,str:it.str,fn:it.fontName,nm:nm.replace(/^[A-Z]{6}\+/,''),bold:/bold|black|heavy/i.test(nm),italic:/italic|oblique/i.test(nm)});
    }
    watch(pg);w.addEventListener('pointerdown',e=>{holdPan(e);draw(e,pg)});
  }
}

function mkItem(pg,o){
  const ctx=pg.ctx,W=pg.cw,H=pg.ch,cl=(v,m)=>Math.max(0,Math.min(m-1,Math.round(v)));
  const bx=cl(o.x,W),by=cl(o.y-o.fs,H),bw=Math.max(1,Math.min(W-bx,Math.round(o.w))),bh=Math.max(1,Math.min(H-by,Math.round(o.fs*1.2)));
  const bg=ctx.getImageData(cl(o.x-2,W),cl(o.y-o.fs*.9,H),1,1).data,im=ctx.getImageData(bx,by,bw,bh).data;
  let best=0,col=[0,0,0];
  for(let i=0;i<im.length;i+=4){const k=Math.abs(im[i]-bg[0])+Math.abs(im[i+1]-bg[1])+Math.abs(im[i+2]-bg[2]);if(k>best){best=k;col=[im[i],im[i+1],im[i+2]]}}
  if(best<90)col=[0,0,0];
  const hx='#'+col.map(v=>v.toString(16).padStart(2,'0')).join('');
  const d=el('div','t');d.contentEditable=true;d.dir='auto';d.textContent=o.str;d.spellcheck=true;d.lang='fa';d.dataset.c=hx;if(o.bold)d.dataset.ob=1;if(o.italic)d.dataset.oi=1;if(!o.fn){if(o.bold)d.dataset.b=1;if(o.italic)d.dataset.i=1}
  Object.assign(d.style,{left:o.x+'px',top:(o.y-o.fs)+'px',fontSize:o.fs+'px',minWidth:o.w+'px',color:'transparent',caretColor:hx,...(o.fn?{fontFamily:`"${o.fn}",V,Tahoma`}:{}),...(o.ff?{fontFamily:`'${o.ff}',Tahoma`}:{}),
    fontWeight:!o.fn&&o.bold?'bold':'normal',fontStyle:!o.fn&&o.italic?'italic':'normal'});
  const m=d._o={rx:rtl(o.str)?o.x+o.w:null,ox:o.x,oy:o.y,ofs:o.fs,x:o.x,y:o.y,fs:o.fs,w:o.w,bg:[bg[0],bg[1],bg[2]],dirty:false,bold:o.bold};
  d._pg=pg;d.spellcheck=true;d.lang='fa';d.dataset.f=o.fn?'orig':(o.ff||'Vazirmatn');if(o.fn)d.dataset.of=o.fn;d.dataset.nm=o.nm||'';
  d.oninput=()=>{dirty(d);anchor(d)};
  d.onfocus=()=>{select(d);d._b=snap(d)};
  d.onblur=()=>{if(m.dirty)normFa(d);if(d._b){const a=snap(d);if(a.t!==d._b.t||a.css!==d._b.css)rec(d,d._b,a);d._b=null}if(!m.dirty)d.style.color='transparent'};
  pg.L.append(d);d.style.top=(m.y-baseline(d))+'px';return d;
}
function pos(e,pg){const r=pg.w.getBoundingClientRect();return[(e.clientX-r.left)/Z,(e.clientY-r.top)/Z]}
function draw(e,pg){
  if(tool==='move'){const t=e.target.closest&&e.target.closest('.t:not(.add)');if(t){e.preventDefault();select(t);moveBy(t,e)}return}
  if(tool==='select'){if(e.target===pg.w||e.target.tagName==='CANVAS')select(null);return}
  if(tool==='erase'){e.preventDefault();return erase(e,pg)}
  const [x,y]=pos(e,pg),c=$('col').value;
  if(tool==='note'||tool==='text')return tapTool(e,pg);
  if(tool==='ink'||tool==='arrow'||tool==='highlight'){e.preventDefault();return trace(e,pg,tool)}
  if(['link','ftext','fcheck','fdrop','underline','strike','redact','crop','ellipse'].includes(tool)){e.preventDefault();const k=tool;return box(e,pg,(X,Y,W,H)=>k==='crop'?cropPage(pg,X,Y,W,H):mkBox(pg,k,X,Y,W,H))}
  const s=document.createElementNS(NS,tool==='line'?'line':'rect');
  s.setAttribute('stroke',c);s.setAttribute('stroke-width',$('lw').value);
  s.setAttribute('fill',tool==='rect'&&$('fill').checked?c:'none');
  s.onpointerdown=ev=>{if(tool==='select'){ev.stopPropagation();select(s)}};
  pg.svg.append(s);const k=tool;let dead=false;stroke={cancel:()=>{dead=true;s.remove()}};
  const mv=ev=>{if(panning||multi)return;const[a,b]=pos(ev,pg);
    if(k==='line'){s.setAttribute('x1',x);s.setAttribute('y1',y);s.setAttribute('x2',a);s.setAttribute('y2',b)}
    else{s.setAttribute('x',Math.min(x,a));s.setAttribute('y',Math.min(y,b));s.setAttribute('width',Math.abs(a-x));s.setAttribute('height',Math.abs(b-y))}};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
    if(dead)return;const bb=s.getBBox();if(bb.width+bb.height<6)s.remove()};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);mv(e);
}

function erase(e,pg){
