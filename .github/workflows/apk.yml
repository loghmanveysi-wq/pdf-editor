name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare www
        run: |
          mkdir -p www/lib www/fonts
          cp index.html www/
          sed -i "s#__REPO__#${GITHUB_REPOSITORY}#;s#__VER__#${GITHUB_RUN_NUMBER}#" www/index.html
          mkdir -p www/ocr
          cp node_modules/tesseract.js/dist/tesseract.min.js www/lib/
          cp node_modules/tesseract.js/dist/worker.min.js www/ocr/
          cp node_modules/tesseract.js-core/tesseract-core*.js www/ocr/
          cp node_modules/tesseract.js-core/*.wasm www/ocr/ 2>/dev/null || true
          curl -fsSL -o www/ocr/fas.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/fas.traineddata
          curl -fsSL -o www/ocr/eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/eng.traineddata
          cd www/lib
          curl -fsSL -o pdf.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js
          curl -fsSL -o pdf.worker.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js
          curl -fsSL -o pdf-lib.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js
          curl -fsSL -o fontkit.js https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js
          curl -fsSL -o docx.js https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js
          cd ../fonts
          G=https://cdn.jsdelivr.net/gh/rastikerdar
          curl -fsSL -o Vazirmatn.ttf $G/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Regular.ttf
          curl -fsSL -o Vazirmatn-Bold.ttf $G/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Bold.ttf || true
          curl -fsSL -o Sahel.ttf $G/sahel-font/dist/Sahel.ttf || true
          curl -fsSL -o Shabnam.ttf $G/shabnam-font/dist/Shabnam.ttf || true
          curl -fsSL -o Samim.ttf $G/samim-font/dist/Samim.ttf || true
          curl -fsSL -o Parastoo.ttf $G/parastoo-font/dist/Parastoo.ttf || true
          curl -fsSL -o Gandom.ttf $G/gandom-font/dist/Gandom.ttf || true
          curl -fsSL -o Tanha.ttf $G/tanha-font/dist/Tanha.ttf || true
          GF=https://cdn.jsdelivr.net/gh/google/fonts@main/ofl
          curl -fsSL -o Amiri.ttf $GF/amiri/Amiri-Regular.ttf || true
          curl -fsSL -o Lalezar.ttf $GF/lalezar/Lalezar-Regular.ttf || true
          curl -fsSL -o Tajawal.ttf $GF/tajawal/Tajawal-Regular.ttf || true
          curl -fsSL -o Lateef.ttf $GF/lateef/Lateef-Regular.ttf || true
          curl -fsSL -o ScheherazadeNew.ttf $GF/scheherazadenew/ScheherazadeNew-Regular.ttf || true
          curl -fsSL -o NotoNaskh.ttf "$GF/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf" || true
          mkdir -p user
          cp ../../myfonts/*.ttf ../../myfonts/*.otf user/ 2>/dev/null || true
          (cd user && ls | grep -iE '\.(ttf|otf)$' | python3 -c "import sys,json;print(json.dumps([l.rstrip('\n') for l in sys.stdin]))" > fonts.json) || echo '[]' > user/fonts.json
      - run: npx cap add android && npx cap sync android
      - name: Version and signing
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/;s/versionName \"1.0\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          python3 - <<'E'
          p='android/app/build.gradle'
          s=open(p).read()
          s=s.replace('android {','android {\n    signingConfigs {\n        release {\n            storeFile file(System.getenv("GITHUB_WORKSPACE") + "/app.keystore")\n            storePassword "pdfeditor123"\n            keyAlias "pdfeditor"\n            keyPassword "pdfeditor123"\n        }\n    }',1)
          s=s.replace('buildTypes {\n        release {','buildTypes {\n        release {\n            signingConfig signingConfigs.release',1)
          open(p,'w').write(s)
          E
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-editor-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: نسخه ${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
